# The checks every pull request and every push to main run (spec §14.2). Part A of T02;
# the preview checks and the deployments (preview.yml, deploy.yml) follow T04.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash -eo pipefail

# A pull request runs these on every push to its branch, against the result of merging it.
# There's one run per push, so no skipped copy can stand in for a required check. Pull
# requests from forks run them too, with no secrets (CI uses none). No job keeps a package
# cache: one that a dependency running here could rewrite would reach the deploy jobs, which
# hold the database URLs.
jobs:
  checks:
    name: Lint, types, format and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:functions

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Only what the tests and the type generation need. Kong stays, because the CLI checks
      # the other services' health through it.
      - name: Start a local Supabase stack
        id: stack
        run: pnpm supabase start --exclude studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: pgTAP, including the schema guards
        run: pnpm supabase test db
      # Contract sync (spec §14.2, D22): the committed types must match the migrations. It runs
      # even when pgTAP fails, so both results show. Swift types join with the iOS app (T71).
      - name: Generated types match the schema
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          pnpm supabase gen types --lang typescript --schema public > packages/contracts/src/database.types.ts
          git diff --exit-code -- packages/contracts/src/database.types.ts || {
            echo "::error::The generated types are out of date. Run: pnpm supabase gen types --lang typescript --schema public > packages/contracts/src/database.types.ts"
            exit 1
          }

  build:
    name: Build the web app
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build

  e2e:
    name: End-to-end journeys (Playwright)
    needs: [build, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Journeys on a local Supabase stack
        run: |
          if [ -z "$(find apps/web/e2e -name '*.spec.ts' -print -quit)" ]; then
            echo "::notice::No end-to-end journeys yet. The first arrives in T17, which sets up Playwright here."
            exit 0
          fi
          echo "::error::There are journeys in apps/web/e2e, but this job doesn't run them yet (T17 sets it up)."
          exit 1

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # A made-up secret of each kind in .github/gitleaks.toml must be caught, so a weakened rule
      # fails here instead of letting a real secret through.
      - name: Check the rules still catch each kind of secret
        run: |
          random() { openssl rand -base64 96 | tr -dc "$1" | cut -c1-"$2"; }
          samples="$RUNNER_TEMP/samples"
          mkdir -p "$samples"
          printf 'postgresql://postgres.%s:%s@aws-1-eu-west-2.pooler.supabase.com:5432/postgres\n' \
            "$(random a-z 20)" "$(random A-Za-z0-9 24)" > "$samples/database-url"
          printf 'sb_secret_%s\n' "$(random A-Za-z0-9 31)" > "$samples/supabase-secret-key"
          printf 'sbp_%s\n' "$(openssl rand -hex 20)" > "$samples/supabase-access-token"
          printf 're_%s_%s\n' "$(random A-Za-z0-9 8)" "$(random A-Za-z0-9 24)" > "$samples/resend-api-key"
          printf 'api_key = "%s"\n' "$(random A-Za-z0-9 32)" > "$samples/generic-api-key"
          for sample in "$samples"/*; do
            if "$RUNNER_TEMP/gitleaks" dir --config .github/gitleaks.toml --no-banner --redact "$sample" > /dev/null 2>&1; then
              echo "::error::No rule caught the made-up $(basename "$sample")."
              exit 1
            fi
          done
          echo "Every kind of secret was caught."
      # Letting a finding through takes a visible change to this file or to the rules: no ignore
      # file, no inline allow comments, and no committed attributes hiding a file's text from git's
      # diffs. Text typed while resolving a merge conflict is in no commit's diff, so the files as
      # checked out are scanned as well.
      - name: Scan the whole history, and the files
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore isn't allowed. Change .github/gitleaks.toml instead."
            exit 1
          fi
          printf '* diff\n' > .git/info/attributes
          "$RUNNER_TEMP/gitleaks" git --config .github/gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --verbose .
          "$RUNNER_TEMP/gitleaks" dir --config .github/gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --verbose .

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Letting an advisory through takes a visible change to this file: no exceptions in the
      # package settings, and the advisories come from npm's own registry.
      - name: Fail on high or critical advisories (NFR-SEC-08)
        run: |
          if grep -snE 'auditConfig|ignoreCves|ignoreGhsas|ignore-cves|ignore-ghsas' pnpm-workspace.yaml package.json .npmrc; then
            echo "::error::Audit exceptions aren't allowed in the package settings."
            exit 1
          fi
          pnpm audit --audit-level high --registry https://registry.npmjs.org/
