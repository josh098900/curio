packages:
  - apps/web
  - packages/*

# Supply chain (NFR-SEC-08). No package may run an install script: each one that
# has a script is listed as false, and pnpm 11 stops if an unlisted one appears.
allowBuilds:
  supabase: false # CLI 3 has no script; its binary is the @supabase/cli-<platform> package
  sharp: false # ships prebuilt binaries, so its script isn't needed
  unrs-resolver: false # the same

# A release must be a day old before pnpm installs it.
minimumReleaseAge: 1440

engineStrict: true
